site_name: Hyperion Wiki
site_url: https://wellymode.github.io/hyperion-wiki/
site_description: Официальная Вики сервера Hyperion Minecraft

theme:
  name: material
  language: ru
  palette:
    # Scheme toggle for dark mode (default)
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Переключить на светлую тему
    # Scheme toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Переключить на тёмную тему

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.action.edit

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - attr_list
  - md_in_html

nav:
  - 'Главная': welcome.md
  - 'Правила': rules.md
  - 'Плагины':
      - 'Защита от гриферства': plugins/coreprotect.md
      - 'Варка напитков': plugins/breweryx.md
      - 'Динамическая карта': plugins/dynmap.md